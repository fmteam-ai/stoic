server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Real client IP behind the Caddy TLS ingress (docker-compose.tls.yml).
    # Caddy sets X-Forwarded-For to the single, Caddy-resolved client IP
    # ({client_ip}: the socket peer, or CF-Connecting-IP from a trusted
    # Cloudflare edge in the cloudflare overlay). Only hops from the private
    # docker / loopback ranges are trusted to rewrite $remote_addr, so a
    # client talking to this port directly cannot spoof its address.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' wss: https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SEC-002 — the backend (security.client_ip) keys on the RIGHTMOST
        # X-Forwarded-For entry. $proxy_add_x_forwarded_for appends
        # $remote_addr — already resolved to the true client by the realip
        # rules above — so the rightmost hop is always the trusted one, and
        # any client-supplied entries stay to its left (ignored).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # TRUST_CF_CONNECTING_IP=true (cloudflare overlay) makes the backend
        # prefer CF-Connecting-IP — never pass a client-supplied value through:
        # pin it to the realip-resolved client (Caddy only resolves it from
        # CF-Connecting-IP when the peer is a trusted Cloudflare edge).
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
