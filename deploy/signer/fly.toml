# STOIC release signer on Fly.io — deploy with deploy/signer/init_fly_signer.sh (first time) / flyctl deploy (redeploy)
# (the script rewrites `app` to the name you choose).
app = "stoic-signer"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "9443"

[http_service]
  internal_port = 9443
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
