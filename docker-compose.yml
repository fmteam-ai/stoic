
# Shared config for the API + all six workers. Credentials come from Docker
# secrets (./secrets/*, generated by deploy/install.sh) via *_FILE
# indirection resolved by backend/secrets_loader.py — never from .env files.
x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile.backend
    args:
      # Immutable build provenance — installer injects the exact commit SHA
      # (from backend/BUILD_SHA in release archives, or git rev-parse in a
      # checkout). The backend image build FAILS if this is missing.
      GIT_SHA: ${GIT_SHA:-}
  restart: unless-stopped
  env_file:
    - backend/.env
  environment: &app-env
    MONGO_URL_FILE: /run/secrets/mongo_url
    JWT_SECRET_FILE: /run/secrets/jwt_secret
    KEY_VAULT_MASTER_FILE: /run/secrets/key_vault_master
    SECRETS_MASTER_KEY_FILE: /run/secrets/secrets_master_key
    METRICS_TOKEN_FILE: /run/secrets/metrics_token
    ORDER_AUTH_SECRET_FILE: /run/secrets/order_auth_secret
    LEDGER_ANCHOR_KEY_FILE: /run/secrets/ledger_anchor_key
    # A13-2 / main98 — EA bridge tokens are HMAC-hashed under their OWN key (never JWT_SECRET)
    BRIDGE_TOKEN_HASH_KEY_FILE: /run/secrets/bridge_token_hash_key
    # Release signing: the private key lives ONLY in the signer sidecar. The
    # API presents a bearer token over TLS (self-signed cert pinned via CA bundle).
    # N100-11 / N101-5 — the API holds ONLY the bundle token; the release token (signer_token) is never
    # mounted into app containers, so the API cannot obtain an EA-release / model-manifest signature.
    # RELEASE_SIGNER_TOKEN is deliberately ABSENT here (CI-only credential).
    RELEASE_SIGNER_BUNDLE_TOKEN_FILE: /run/secrets/signer_token_bundle
    RELEASE_SIGNER_CA_BUNDLE: /run/secrets/signer_cert
    # Exact backend image identity — REQUIRED in production risk snapshots
    # (deploy/install.sh writes it to .env after the image build).
    STOIC_IMAGE_DIGEST: ${STOIC_IMAGE_DIGEST:-}
    # A19-P1-04 — signed host profile refreshed daily by the host timer (deploy/host-profile-refresh.sh);
    # read on every readiness check, never cached in env, expires after 24 h
    STOIC_HOST_PROFILE_FILE: /app/state/host_profile.json
  volumes:
    - ./deploy/state:/app/state:ro
  secrets:
    - mongo_url
    - jwt_secret
    - key_vault_master
    - secrets_master_key
    - metrics_token
    - order_auth_secret
    - ledger_anchor_key
    - bridge_token_hash_key
    - signer_token_bundle
    - signer_cert
  depends_on:
    mongo:
      condition: service_healthy
    signer:
      condition: service_healthy

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Auth enforced: root for admin ops, least-privilege app user (readWrite
    # on DB_NAME only) created by deploy/mongo-init.js on first init.
    # Passwords live in Docker secrets, never in env files.
    # Single-node replica set (rs0, keyFile auth) — transactions are REQUIRED
    # in production (audit r17 P0-01); deploy/mongo-start.sh wires the keyFile,
    # the healthcheck initiates the set once and is green only when PRIMARY.
    command: ["sh", "/stoic-mongo-start.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set in .env — see deploy/env/root.env.example}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password   # re-pointed to a mongodb-owned copy by deploy/mongo-start.sh
      MONGO_APP_USER: ${MONGO_APP_USER:?set in .env — see deploy/env/root.env.example}
      DB_NAME: ${DB_NAME:?set in .env — see deploy/env/root.env.example}
    secrets:
      - mongo_root_password
      - mongo_app_password
      - mongo_keyfile
    volumes:
      - mongo_data:/data/db
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./deploy/mongo-start.sh:/stoic-mongo-start.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$(cat /run/secrets/mongo_root_password)"
          --eval 'try { rs.status() } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)'
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  signer:
    # Release signer sidecar (deploy/signer): holds the Ed25519 private key,
    # internal network only, TLS with the install-generated certificate.
    build:
      context: ./deploy/signer
    restart: unless-stopped
    environment:
      # N102-5 — the self-hosted sidecar is a RUNTIME signer: it never loads a release token and refuses
      # release purposes for every caller, so root on this host cannot mint EA-release signatures.
      SIGNER_ROLE: runtime
      SIGNER_TOKEN_BUNDLE_FILE: /run/secrets/signer_token_bundle
      # N101-5 — the runtime key carries its own id; the CI release key (EA records, model manifests)
      # is pinned separately in backend/.env as RELEASE_PUBLIC_KEY_B64 / RELEASE_SIGNER_KEY_ID.
      SIGNER_KEY_ID: ${SIGNER_KEY_ID:-stoic-bundle-ed25519-v1}
      ED25519_SIGNING_KEY_B64_FILE: /run/secrets/signer_ed25519_key
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "9443",
              "--ssl-certfile", "/run/secrets/signer_cert", "--ssl-keyfile", "/run/secrets/signer_cert_key"]
    secrets:
      - signer_token_bundle
      - signer_ed25519_key
      - signer_cert
      - signer_cert_key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,ssl;ctx=ssl.create_default_context(cafile='/run/secrets/signer_cert');urllib.request.urlopen('https://localhost:9443/healthz',context=ctx,timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    <<: *app-common
    environment:
      <<: *app-env
      # Dedicated worker services below own the loops — the API must NOT
      # double-run them.
      BACKGROUND_WORKERS_IN_PROCESS: "false"
    ports:
      # loopback-only: clients must go through the frontend/ingress proxy
      # (security headers, normalized X-Forwarded-*, TLS) — never direct.
      - "127.0.0.1:8001:8001"

  worker-trading:
    <<: *app-common
    command: ["python", "-m", "workers.trading"]

  worker-protection:
    <<: *app-common
    command: ["python", "-m", "workers.protection"]

  worker-reconciliation:
    <<: *app-common
    command: ["python", "-m", "workers.reconciliation"]

  worker-analytics:
    <<: *app-common
    command: ["python", "-m", "workers.analytics"]

  worker-security:
    <<: *app-common
    command: ["python", "-m", "workers.security"]
    # S14 — the security Telegram bot token as a Docker secret is mounted ONLY into this worker.
    # Operator default: set SECURITY_AGENT_TELEGRAM_BOT_TOKEN / _CHAT_ID on Admin → Integrations instead
    # (sealed vault, re-auth, audited) — the API and every worker read it from there, so the status
    # page, the test button and the pairing / policy / demo alerts (reconciliation worker) all work.
    environment:
      <<: *app-env
      SECURITY_AGENT_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/security_telegram_token
    secrets:
      - mongo_url
      - jwt_secret
      - key_vault_master
      - secrets_master_key
      - metrics_token
      - order_auth_secret
      - ledger_anchor_key
      - bridge_token_hash_key
      - signer_token_bundle
      - security_telegram_token

  worker-model:
    <<: *app-common
    command: ["python", "-m", "workers.model"]

  worker-tuning:
    <<: *app-common
    command: ["python", "-m", "workers.tuning"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Empty default → frontend uses same-origin API routing (nginx
        # proxies /api on the same host). Never default to localhost.
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-}
    restart: unless-stopped
    depends_on:
      # nginx resolves `backend` at startup — without a live backend it exits
      # and restart-loops (RestartCount climbs); wait for the health check
      backend:
        condition: service_healthy
    ports:
      # loopback-only by default; public traffic enters through the TLS
      # ingress (docker-compose.tls.yml → Caddy on 80/443).
      - "127.0.0.1:3000:3000"

secrets:
  security_telegram_token:
    file: ./secrets/security_telegram_token
  mongo_root_password:
    file: ./secrets/mongo_root_password
  mongo_app_password:
    file: ./secrets/mongo_app_password
  mongo_keyfile:
    file: ./secrets/mongo_keyfile
  mongo_url:
    file: ./secrets/mongo_url
  jwt_secret:
    file: ./secrets/jwt_secret
  key_vault_master:
    file: ./secrets/key_vault_master
  secrets_master_key:
    file: ./secrets/secrets_master_key
  metrics_token:
    file: ./secrets/metrics_token
  order_auth_secret:
    file: ./secrets/order_auth_secret
  ledger_anchor_key:
    file: ./secrets/ledger_anchor_key
  bridge_token_hash_key:
    file: ./secrets/bridge_token_hash_key
  signer_token_bundle:
    file: ./secrets/signer_token_bundle
  signer_ed25519_key:
    file: ./secrets/signer_ed25519_key
  signer_cert:
    file: ./secrets/signer_cert.pem
  signer_cert_key:
    file: ./secrets/signer_cert_key.pem

volumes:
  mongo_data:
