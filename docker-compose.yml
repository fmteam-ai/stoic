version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Auth enforced: root for admin ops, least-privilege app user (readWrite
    # on DB_NAME only) created by deploy/mongo-init.js on first init.
    # Secrets come from the compose-level .env (see .env.example).
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set in .env — see .env.example}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env — see .env.example}
      MONGO_APP_USER: ${MONGO_APP_USER:?set in .env — see .env.example}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set in .env — see .env.example}
      DB_NAME: ${DB_NAME:?set in .env — see .env.example}
    volumes:
      - mongo_data:/data/db
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      MONGO_URL: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${DB_NAME}?authSource=${DB_NAME}
      # Dedicated worker services below own the loops — the API must NOT
      # double-run them.
      BACKGROUND_WORKERS_IN_PROCESS: "false"
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8001:8001"

  worker-trading:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "workers.trading"]
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      MONGO_URL: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${DB_NAME}?authSource=${DB_NAME}
    depends_on:
      mongo:
        condition: service_healthy

  worker-protection:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "workers.protection"]
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      MONGO_URL: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${DB_NAME}?authSource=${DB_NAME}
    depends_on:
      mongo:
        condition: service_healthy

  worker-reconciliation:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "workers.reconciliation"]
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      MONGO_URL: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${DB_NAME}?authSource=${DB_NAME}
    depends_on:
      mongo:
        condition: service_healthy

  worker-analytics:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "workers.analytics"]
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      MONGO_URL: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${DB_NAME}?authSource=${DB_NAME}
    depends_on:
      mongo:
        condition: service_healthy

  worker-model:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "workers.model"]
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      MONGO_URL: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${DB_NAME}?authSource=${DB_NAME}
    depends_on:
      mongo:
        condition: service_healthy

  worker-tuning:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "workers.tuning"]
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      MONGO_URL: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${DB_NAME}?authSource=${DB_NAME}
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Empty default → frontend uses same-origin API routing (nginx
        # proxies /api on the same host). Never default to localhost.
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongo_data:
