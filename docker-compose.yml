version: "3.9"

# Shared config for the API + all six workers. Credentials come from Docker
# secrets (./secrets/*, generated by deploy/install.sh) via *_FILE
# indirection resolved by backend/secrets_loader.py — never from .env files.
x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile.backend
    args:
      # Immutable build provenance — installer injects the exact commit SHA
      # (from backend/BUILD_SHA in release archives, or git rev-parse in a
      # checkout). The backend image build FAILS if this is missing.
      GIT_SHA: ${GIT_SHA:-}
  restart: unless-stopped
  env_file:
    - backend/.env
  environment: &app-env
    MONGO_URL_FILE: /run/secrets/mongo_url
    JWT_SECRET_FILE: /run/secrets/jwt_secret
    KEY_VAULT_MASTER_FILE: /run/secrets/key_vault_master
    METRICS_TOKEN_FILE: /run/secrets/metrics_token
    ORDER_AUTH_SECRET_FILE: /run/secrets/order_auth_secret
    LEDGER_ANCHOR_KEY_FILE: /run/secrets/ledger_anchor_key
    # Release signing: the private key lives ONLY in the signer sidecar. The
    # API presents a bearer token over TLS (self-signed cert pinned via CA bundle).
    RELEASE_SIGNER_TOKEN_FILE: /run/secrets/signer_token
    RELEASE_SIGNER_CA_BUNDLE: /run/secrets/signer_cert
    # Exact backend image identity — REQUIRED in production risk snapshots
    # (deploy/install.sh writes it to .env after the image build).
    STOIC_IMAGE_DIGEST: ${STOIC_IMAGE_DIGEST:-}
  secrets:
    - mongo_url
    - jwt_secret
    - key_vault_master
    - metrics_token
    - order_auth_secret
    - ledger_anchor_key
    - signer_token
    - signer_cert
  depends_on:
    mongo:
      condition: service_healthy
    signer:
      condition: service_healthy

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Auth enforced: root for admin ops, least-privilege app user (readWrite
    # on DB_NAME only) created by deploy/mongo-init.js on first init.
    # Passwords live in Docker secrets, never in env files.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set in .env — see .env.example}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_APP_USER: ${MONGO_APP_USER:?set in .env — see .env.example}
      DB_NAME: ${DB_NAME:?set in .env — see .env.example}
    secrets:
      - mongo_root_password
      - mongo_app_password
    volumes:
      - mongo_data:/data/db
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

  signer:
    # Release signer sidecar (deploy/signer): holds the Ed25519 private key,
    # internal network only, TLS with the install-generated certificate.
    build:
      context: ./deploy/signer
    restart: unless-stopped
    environment:
      SIGNER_TOKEN_FILE: /run/secrets/signer_token
      ED25519_SIGNING_KEY_B64_FILE: /run/secrets/signer_ed25519_key
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "9443",
              "--ssl-certfile", "/run/secrets/signer_cert", "--ssl-keyfile", "/run/secrets/signer_cert_key"]
    secrets:
      - signer_token
      - signer_ed25519_key
      - signer_cert
      - signer_cert_key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,ssl;ctx=ssl.create_default_context(cafile='/run/secrets/signer_cert');urllib.request.urlopen('https://localhost:9443/healthz',context=ctx,timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    <<: *app-common
    environment:
      <<: *app-env
      # Dedicated worker services below own the loops — the API must NOT
      # double-run them.
      BACKGROUND_WORKERS_IN_PROCESS: "false"
    ports:
      # loopback-only: clients must go through the frontend/ingress proxy
      # (security headers, normalized X-Forwarded-*, TLS) — never direct.
      - "127.0.0.1:8001:8001"

  worker-trading:
    <<: *app-common
    command: ["python", "-m", "workers.trading"]

  worker-protection:
    <<: *app-common
    command: ["python", "-m", "workers.protection"]

  worker-reconciliation:
    <<: *app-common
    command: ["python", "-m", "workers.reconciliation"]

  worker-analytics:
    <<: *app-common
    command: ["python", "-m", "workers.analytics"]

  worker-model:
    <<: *app-common
    command: ["python", "-m", "workers.model"]

  worker-tuning:
    <<: *app-common
    command: ["python", "-m", "workers.tuning"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Empty default → frontend uses same-origin API routing (nginx
        # proxies /api on the same host). Never default to localhost.
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # loopback-only by default; public traffic enters through the TLS
      # ingress (docker-compose.tls.yml → Caddy on 80/443).
      - "127.0.0.1:3000:3000"

secrets:
  mongo_root_password:
    file: ./secrets/mongo_root_password
  mongo_app_password:
    file: ./secrets/mongo_app_password
  mongo_url:
    file: ./secrets/mongo_url
  jwt_secret:
    file: ./secrets/jwt_secret
  key_vault_master:
    file: ./secrets/key_vault_master
  metrics_token:
    file: ./secrets/metrics_token
  order_auth_secret:
    file: ./secrets/order_auth_secret
  ledger_anchor_key:
    file: ./secrets/ledger_anchor_key
  signer_token:
    file: ./secrets/signer_token
  signer_ed25519_key:
    file: ./secrets/signer_ed25519_key
  signer_cert:
    file: ./secrets/signer_cert.pem
  signer_cert_key:
    file: ./secrets/signer_cert_key.pem

volumes:
  mongo_data:
