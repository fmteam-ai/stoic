version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      # Dedicated worker services below own the loops — the API must NOT
      # double-run them.
      BACKGROUND_WORKERS_IN_PROCESS: "false"
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8001:8001"

  worker-trading:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "workers.trading"]
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy

  worker-protection:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "workers.protection"]
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy

  worker-reconciliation:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "workers.reconciliation"]
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy

  worker-analytics:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "workers.analytics"]
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy

  worker-model:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "workers.model"]
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongo_data:
