# Host migration sidecar (opt-in: `make migrator-on` appends this file to
# COMPOSE_FILE and pins STOIC_ROOT). Gives the admin wizard at
# /admin/host-migration a privileged worker that can stop/start this stack
# (docker socket) and drive the NEW host over SSH. The API container itself
# never gets docker or SSH access — it only proxies to this service with the
# dedicated, 24h-expiring migrator_token. Remove after the migration:
# `make migrator-off`. The docker socket is root-equivalent and cannot be made
# read-only (see Dockerfile.migrator) — it exists only while this overlay is on.
services:
  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrator
    restart: unless-stopped
    working_dir: ${STOIC_ROOT:?run `make migrator-on` (pins the checkout path)}
    environment:
      STOIC_ROOT: ${STOIC_ROOT}
      # dedicated one-time token (secrets/migrator_token) — NEVER the metrics token
      MIGRATOR_TOKEN_FILE: /run/secrets/migrator_token
      # hard expiry written by `make migrator-on` (24h); requests → 410 afterwards
      MIGRATOR_ENABLED_UNTIL: ${MIGRATOR_ENABLED_UNTIL:-}
      # MIGRATOR_DRY_RUN=1 make migrator-on → rehearsal: the wizard runs end to
      # end with simulated commands, nothing is touched on either host
      MIGRATOR_DRY_RUN: ${MIGRATOR_DRY_RUN:-0}
    volumes:
      # required: stop/start of this stack. NOT restrictable with :ro (socket API)
      - /var/run/docker.sock:/var/run/docker.sock
      # same absolute path inside and outside so `docker compose` resolves
      # bind mounts / secrets exactly like the host does — READ-ONLY; only the
      # migration state directory (key, known_hosts, state.json, mode 0700) is writable
      - ${STOIC_ROOT}:${STOIC_ROOT}:ro
      - ${STOIC_ROOT}/release/migration:${STOIC_ROOT}/release/migration
    secrets:
      - migrator_token
    # no `ports:` — reachable only from the compose network (API → migrator)

  backend:
    environment:
      MIGRATOR_URL: http://migrator:8790
      MIGRATOR_TOKEN_FILE: /run/secrets/migrator_token
    secrets:
      - migrator_token

secrets:
  migrator_token:
    file: ./secrets/migrator_token
