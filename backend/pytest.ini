[pytest]
pythonpath = .
markers =
    unit: pure unit tests — no DB, no network, no running backend
    integration: needs MongoDB (MONGO_URL) but no running backend
    http: needs the running backend via REACT_APP_BACKEND_URL
    broker: needs a live broker EA connection (never run in CI)
    external: hits live external services (never run in ordinary CI)
    chaos: fault-injection / resilience drills — on demand, never ordinary CI
    soak: production-proof soak-campaign checks against a live env — on demand
    read_only: live test that performs NO writes — safe against any env
    critical_controls: safety-critical control tests — REQUIRED CI lane (ci.yml critical-controls, release.yml ci-gates)
    demo_mutating: writes demo/preview data — needs STOIC_ALLOW_MUTATING_TESTS=YES
    staging_mutating: writes staging data — needs STOIC_ALLOW_MUTATING_TESTS=YES
    destructive: deletes/overwrites data — needs STOIC_ALLOW_MUTATING_TESTS=YES
    live_authorized: explicitly authorized to run against a LIVE environment
