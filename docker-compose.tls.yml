# TLS ingress overlay — use together with the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
# (deploy/install.sh --production <domain> wires this automatically via
#  COMPOSE_FILE in ./.env)
# Caddy terminates TLS with automatic Let's Encrypt certificates and
# forwards everything to the frontend nginx (which proxies /api internally).
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env for TLS deployments}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
