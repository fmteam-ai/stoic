name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # cosign keyless (Sigstore OIDC)
  packages: write   # GHCR image publication

jobs:
  ci-gates:
    # Full CI suite (unit tests, gitleaks, pip-audit, static analysis,
    # frontend build, container vuln scan) MUST pass on the exact tagged
    # commit before any release artifact is published.
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read

  suite-from-archive:
    # The release is only as good as the archive it ships — run the complete
    # classified (non-live) suite from the exact exported tree: unit +
    # execution-truth + DB-integration. The http/broker/external classes are
    # gated by install-from-archive below and the staging soak campaign
    # (scripts/run_full_suite.sh).
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: stoic_release_ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Export exact release archive
        run: git archive --format=tar.gz -o /tmp/stoic-release.tar.gz HEAD
      - name: Unpack to a clean tree
        run: mkdir /tmp/release && tar -xzf /tmp/stoic-release.tar.gz -C /tmp/release
      - name: Archive completeness gate (deployment files MUST ship)
        run: |
          # github.sha is the TAG OBJECT for annotated tags — peel it to the
          # underlying commit or this gate blocks every valid annotated release.
          WANT=$(git rev-parse --verify --quiet "${GITHUB_SHA}^{commit}" \
                 || git rev-parse HEAD^{commit})
          cd /tmp/release
          for f in .env.example backend/.env.example frontend/.env.example \
                   deploy/install.sh docker-compose.yml docker-compose.tls.yml \
                   deploy/Caddyfile deploy/mongo-init.js README.md \
                   docs/TEST_MANIFEST.md backend/BUILD_SHA; do
            test -f "$f" || { echo "RELEASE BLOCKED: $f missing from archive"; exit 1; }
          done
          # immutable Git provenance must EQUAL the workflow commit —
          # not merely look like a SHA
          ARCHIVE_SHA=$(cat backend/BUILD_SHA)
          if [ "${ARCHIVE_SHA}" != "${WANT}" ]; then
            echo "RELEASE BLOCKED: backend/BUILD_SHA (${ARCHIVE_SHA}) != GITHUB_SHA commit (${WANT})"
            exit 1
          fi
          echo "archive provenance: ${ARCHIVE_SHA} == GITHUB_SHA commit"
          # generated bytecode must never ship in a release archive
          if find . -name "__pycache__" -o -name "*.pyc" | grep -q .; then
            echo "RELEASE BLOCKED: compiled Python artifacts found in the archive:"
            find . -name "__pycache__" -o -name "*.pyc" | head
            exit 1
          fi
          echo "all deployment files present; no generated bytecode in the archive"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Run classified suite from the archive (unit + truth + integration)
        run: |
          cd /tmp/release
          # requirements.txt is a pip freeze of the runtime env. The
          # emergentintegrations internal wheel hard-pins openai==1.99.9
          # (app uses a newer one), so it is installed WITHOUT deps from
          # the Emergent index; torch +cpu resolves from the PyTorch index.
          grep -v '^emergentintegrations' backend/requirements.txt > /tmp/ci-reqs.txt
          pip install -r /tmp/ci-reqs.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
          # Emergent CDN index occasionally serves an empty page — retry.
          # SECURITY: --index-url (EXCLUSIVE, no public PyPI fallback —
          # dependency-confusion hardening) + sha256 pin of the exact wheel.
          EI_SHA256=1822c409e24817689541891784b8ec3ff4dfed845ce8cd09fd4feb91ba3a4bdd
          for i in 1 2 3 4 5; do
            pip download --no-deps emergentintegrations==0.2.0 -d /tmp/ei \
              --index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ \
              && break
            echo "emergentintegrations download attempt $i failed — retry in 15s"
            sleep 15
          done
          echo "${EI_SHA256}  /tmp/ei/emergentintegrations-0.2.0-py3-none-any.whl" | sha256sum -c -
          pip install --no-deps /tmp/ei/emergentintegrations-0.2.0-py3-none-any.whl
          pip show -q emergentintegrations
          cd backend
          # zero collection errors in the exact pinned environment
          python -m pytest tests/unit --collect-only -q
          python -m pytest tests/unit \
            tests/test_iter148_p0_exec_truth.py \
            tests/test_iter149_netting_truth.py \
            tests/test_iter150_netting_hedging.py::TestEaSourceScenarios \
            -q --junitxml=/tmp/junit-unit.xml
          python -m pytest tests/integration -m integration -q --junitxml=/tmp/junit-integration.xml
      - name: Upload test evidence (consumed by the signed release attestation)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: junit-evidence
          path: |
            /tmp/junit-unit.xml
            /tmp/junit-integration.xml

  hermetic-verify:
    # Audit round 7 P2 — ONE reproducible command (scripts/verify_release.sh) run
    # from the exact exported archive on a clean runner: locked backend + frontend
    # deps, SBOMs, compile/syntax, unit + integration suites, lint + build, test
    # manifest currency, credential-literal scan. Results are HMAC-signed with the
    # dedicated evidence key and bound to the release commit; the attestation
    # gate `hermetic_verification` is REJECTED unless every step is PASS + signed.
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: stoic_release_verify
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Export exact release archive to a clean tree
        run: |
          git archive --format=tar.gz -o /tmp/stoic-release.tar.gz HEAD
          mkdir /tmp/verify && tar -xzf /tmp/stoic-release.tar.gz -C /tmp/verify
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: "20"
      - name: Run the hermetic verification command
        env:
          LEDGER_ANCHOR_KEY: ${{ secrets.RELEASE_EVIDENCE_KEY }}
          REQUIRE_SIGNED_RESULTS: "1"
          VERIFY_RESULTS_PATH: /tmp/hermetic-verification.json
        run: |
          # bind the results to the release commit (archive tree has no .git)
          COMMIT_SHA=$(git rev-parse --verify --quiet "${GITHUB_SHA}^{commit}" || git rev-parse HEAD^{commit})
          cd /tmp/verify
          git init -q . && git add -A >/dev/null 2>&1 && git -c user.email=ci@stoic -c user.name=ci commit -qm "archive" >/dev/null 2>&1 || true
          # verify_release.sh reads GIT_SHA from `git rev-parse HEAD`; override with the real release commit
          sed -i "s|^GIT_SHA=.*|GIT_SHA=${COMMIT_SHA}|" scripts/verify_release.sh
          bash scripts/verify_release.sh
          cp -r release/verification /tmp/verification-out
      - name: Upload hermetic verification evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: hermetic-verification
          path: |
            /tmp/hermetic-verification.json
            /tmp/verification-out/

  install-from-archive:
    # A fresh deployment must succeed from the exact exported archive: run
    # the REAL installer (secrets generation, Mongo auth + init script,
    # image builds, full 9-container topology) and gate on release-readiness
    # reporting ready=true (Mongo round trip, every worker lease AND every
    # worker loop running, reconciliation, outbox, schema).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Export and unpack exact release archive
        run: |
          # peel annotated-tag object → commit (github.sha is NOT the commit
          # for annotated tags)
          WANT=$(git rev-parse --verify --quiet "${GITHUB_SHA}^{commit}" \
                 || git rev-parse HEAD^{commit})
          git archive --format=tar.gz -o /tmp/stoic-release.tar.gz HEAD
          mkdir /tmp/install && tar -xzf /tmp/stoic-release.tar.gz -C /tmp/install
          # provenance must EQUAL the workflow commit
          ARCHIVE_SHA=$(cat /tmp/install/backend/BUILD_SHA)
          if [ "${ARCHIVE_SHA}" != "${WANT}" ]; then
            echo "RELEASE BLOCKED: BUILD_SHA (${ARCHIVE_SHA}) != GITHUB_SHA commit (${WANT})"
            exit 1
          fi
      - name: Run the installer (dev mode — loopback only)
        run: |
          cd /tmp/install
          deploy/install.sh --dev
      - name: Gate on full-topology release readiness
        run: |
          cd /tmp/install
          TOKEN=$(cat secrets/metrics_token)
          for i in $(seq 1 60); do
            if curl -sS -H "X-Metrics-Token: ${TOKEN}" http://127.0.0.1:8001/api/ops/release-readiness \
                 | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ready"], d; print("READY:", d["checks"]["workers"]["detail"])'; then
              exit 0
            fi
            sleep 5
          done
          echo "release-readiness never became ready — final state:"
          curl -sS -H "X-Metrics-Token: ${TOKEN}" http://127.0.0.1:8001/api/ops/release-readiness || true
          docker compose logs --tail 30
          exit 1
      - name: Teardown
        if: always()
        run: cd /tmp/install && docker compose down -v || true

  ea-compile:
    # Compile the exact tagged EA source with real MetaEditor so the release
    # ships a verified .ex5, never a locally built binary.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Install MetaTrader 5 (silent)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile mt5setup.exe
          Start-Process -FilePath .\mt5setup.exe -ArgumentList "/auto" -Wait
          if (-not (Test-Path "C:\Program Files\MetaTrader 5\metaeditor64.exe")) {
            throw "MetaEditor not found after install"
          }
      - name: Compile EA with MetaEditor
        shell: pwsh
        run: |
          $me = "C:\Program Files\MetaTrader 5\metaeditor64.exe"
          $src = (Resolve-Path "backend\static\EmergentTradingBridge.mq5").Path
          Start-Process -FilePath $me -ArgumentList "/compile:`"$src`"","/log:compile.log" -Wait
          $log = Get-Content compile.log -Encoding Unicode -Raw
          Write-Host $log
          if ($log -notmatch "0 error") { throw "EA compilation reported errors" }
          if (-not (Test-Path "backend\static\EmergentTradingBridge.ex5")) {
            throw "Compiled .ex5 not produced"
          }
      - name: Publish verified .ex5 artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: EmergentTradingBridge-ex5
          path: backend/static/EmergentTradingBridge.ex5

  release:
    runs-on: ubuntu-latest
    needs: [ci-gates, suite-from-archive, hermetic-verify, install-from-archive, ea-compile]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Resolve release commit (peel annotated-tag object)
        run: |
          COMMIT_SHA=$(git rev-parse --verify --quiet "${GITHUB_SHA}^{commit}" \
                       || git rev-parse HEAD^{commit})
          echo "COMMIT_SHA=${COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "release commit ${COMMIT_SHA} (event sha ${GITHUB_SHA})"
      - name: Download verified .ex5
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          name: EmergentTradingBridge-ex5
          path: backend/static/
      - name: Download test evidence (junit)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          name: junit-evidence
          path: evidence/
      - name: Download hermetic verification evidence (signed results + SBOMs)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          name: hermetic-verification
          path: evidence/hermetic/
      - name: Hermetic verification must be PASS, signed and bound to this commit
        env:
          LEDGER_ANCHOR_KEY: ${{ secrets.RELEASE_EVIDENCE_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib, hmac, json, os, sys
          d = json.load(open("evidence/hermetic/hermetic-verification.json"))
          sig = d.pop("signature", None); d.pop("evidence_hash", None)
          payload = json.dumps(d, sort_keys=True, separators=(",", ":")).encode()
          want = hmac.new(os.environ["LEDGER_ANCHOR_KEY"].encode(), payload, hashlib.sha256).hexdigest()
          ok = sig and hmac.compare_digest(want, sig) and d["result"] == "PASS" and d["build"] == os.environ["COMMIT_SHA"]
          print(json.dumps({"result": d["result"], "build": d["build"], "signature_valid": bool(sig) and hmac.compare_digest(want, sig or ""), "steps": d["steps"]}, indent=1))
          sys.exit(0 if ok else 1)
          PY
      - name: Export release archive (BUILD_SHA generated from GITHUB_SHA)
        # github context passes through env vars — never interpolated
        # directly into the shell (CWE-78 defense-in-depth).
        env:
          REF: ${{ github.ref_name }}
        run: |
          git archive --format=tar -o /tmp/stoic.tar HEAD
          mkdir /tmp/pkg && tar -xf /tmp/stoic.tar -C /tmp/pkg
          # export-subst expansion must agree with the release COMMIT —
          # a mismatch means the archive is NOT the audited commit
          ARCHIVE_SHA=$(cat /tmp/pkg/backend/BUILD_SHA)
          if [ "${ARCHIVE_SHA}" != "${COMMIT_SHA}" ]; then
            echo "RELEASE BLOCKED: archive BUILD_SHA (${ARCHIVE_SHA}) != GITHUB_SHA commit (${COMMIT_SHA})"
            exit 1
          fi
          # authoritative generation — BUILD_SHA written directly from the
          # peeled release commit during artifact creation (belt over braces)
          printf '%s\n' "${COMMIT_SHA}" > /tmp/pkg/backend/BUILD_SHA
          tar -czf "stoic-${REF}.tar.gz" -C /tmp/pkg .
          echo "archive provenance verified == ${COMMIT_SHA}"

      - name: Build images
        env:
          REF: ${{ github.ref_name }}
        run: |
          docker build -f Dockerfile.backend --build-arg GIT_SHA="${COMMIT_SHA}" -t "stoic-backend:${REF}" .
          docker build -f Dockerfile.frontend -t "stoic-frontend:${REF}" .

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish images to GHCR (immutable digests)
        id: push
        env:
          REF: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER=$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')
          for c in backend frontend; do
            IMG="ghcr.io/${OWNER}/stoic-${c}"
            docker tag "stoic-${c}:${REF}" "${IMG}:${REF}"
            docker push "${IMG}:${REF}"
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMG}:${REF}")
            echo "${c}_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "published ${DIGEST}"
          done

      - name: Install cosign (image signing)
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - name: Sign container images by immutable digest (cosign keyless)
        run: |
          cosign sign --yes "${{ steps.push.outputs.backend_digest }}"
          cosign sign --yes "${{ steps.push.outputs.frontend_digest }}"

      - name: Verify image signatures on the exact frozen digests
        run: |
          for d in "${{ steps.push.outputs.backend_digest }}" \
                   "${{ steps.push.outputs.frontend_digest }}"; do
            cosign verify "$d" \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
              --certificate-github-workflow-repository "${{ github.repository }}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done

      - name: SBOM (backend image)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          image: stoic-backend:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom-backend.spdx.json

      - name: SBOM (frontend image)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          image: stoic-frontend:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom-frontend.spdx.json

      - name: Generate release manifest
        env:
          BACKEND_DIGEST: ${{ steps.push.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.push.outputs.frontend_digest }}
        run: |
          python3 - << 'EOF'
          import hashlib, json, os, subprocess
          def sha256(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()
          ref = os.environ["GITHUB_REF_NAME"]
          sha = os.environ["COMMIT_SHA"]
          files = {p: sha256(p) for p in [
              f"stoic-{ref}.tar.gz",
              "backend/static/EmergentTradingBridge.mq5",
              "backend/static/EmergentTradingBridge.ex5",
              "sbom-backend.spdx.json",
              "sbom-frontend.spdx.json",
          ] if os.path.exists(p)}
          ea_version = None
          for line in open("backend/static/EmergentTradingBridge.mq5",
                           encoding="utf-8", errors="ignore"):
              if line.strip().startswith("#property version"):
                  ea_version = line.split('"')[1] if '"' in line else None
                  break
          # unified Host Agent hash — deterministic digest over every
          # source file that produces the MSI (path + content, sorted)
          ha = hashlib.sha256()
          ha_files = 0
          for root, _, names in sorted(os.walk("host_agent")):
              for n in sorted(names):
                  p = os.path.join(root, n)
                  ha.update(p.encode() + b"\0" + bytes.fromhex(sha256(p)))
                  ha_files += 1
          host_agent = {"source_hash": ha.hexdigest(), "files": ha_files,
                        "note": "MSI binary is built, Authenticode-signed "
                                "and independently re-verified in "
                                "msi-release.yml from this exact source"}
          manifest = {
              "tag": ref, "commit": sha, "ea_version": ea_version,
              "built_at": subprocess.check_output(
                  ["date", "-u", "+%Y-%m-%dT%H:%M:%SZ"]).decode().strip(),
              "artifacts": files,
              "host_agent": host_agent,
              "images": [os.environ.get("BACKEND_DIGEST"),
                         os.environ.get("FRONTEND_DIGEST")],
              "provenance": {
                  "builder": "github-actions",
                  "workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF"),
                  "run_id": os.environ.get("GITHUB_RUN_ID"),
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "actor": os.environ.get("GITHUB_ACTOR"),
                  "source": "https://github.com/"
                            + str(os.environ.get("GITHUB_REPOSITORY"))
                            + "/tree/" + sha,
                  "signing": "cosign keyless (Sigstore OIDC) — images by "
                             "immutable digest; manifest + SHA256SUMS as "
                             "signed blobs",
              },
          }
          with open("release-manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          EOF

      - name: Checksums
        env:
          REF: ${{ github.ref_name }}
        run: sha256sum "stoic-${REF}.tar.gz" backend/static/EmergentTradingBridge.ex5 release-manifest.json sbom-backend.spdx.json sbom-frontend.spdx.json > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - name: Sign manifest + checksums (keyless, Sigstore)
        run: |
          cosign sign-blob --yes release-manifest.json \
            --output-signature release-manifest.json.sig \
            --output-certificate release-manifest.json.pem
          cosign sign-blob --yes SHA256SUMS \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem

      - name: Verify blob signatures on the exact frozen artifacts
        run: |
          for f in release-manifest.json SHA256SUMS; do
            cosign verify-blob "$f" \
              --signature "$f.sig" --certificate "$f.pem" \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
              --certificate-github-workflow-repository "${{ github.repository }}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done

      - name: Dependency + image scan results as machine-readable evidence
        run: |
          pip install -q pip-audit
          grep -vE '^--|^#|\+cpu|^emergentintegrations' backend/requirements.txt > /tmp/audit-reqs.txt
          pip-audit -r /tmp/audit-reqs.txt --no-deps --strict -f json -o evidence/pip-audit.json
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin v0.110.0
          grype "stoic-backend:${{ github.ref_name }}" --only-fixed -o json --file evidence/grype-backend.json --fail-on critical

      - name: Emit signed release attestation (SHA · digests · test counts · scan results · gates)
        env:
          BACKEND_DIGEST: ${{ steps.push.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.push.outputs.frontend_digest }}
        run: |
          python3 scripts/release_attestation.py emit \
            --sha "${COMMIT_SHA}" --tag "${{ github.ref_name }}" \
            --backend-digest "${BACKEND_DIGEST}" --frontend-digest "${FRONTEND_DIGEST}" \
            --junit evidence/junit-unit.xml --junit evidence/junit-integration.xml \
            --pip-audit evidence/pip-audit.json --grype evidence/grype-backend.json \
            --manifest release-manifest.json --install-ready --ea-compiled \
            --hermetic-verification evidence/hermetic/hermetic-verification.json \
            --command "pytest tests/unit + exec-truth suites (archive env)" \
            --command "pytest tests/integration -m integration" \
            --command "pip-audit --strict (pinned public deps)" \
            --command "grype --only-fixed --fail-on critical (backend image)" \
            --command "deploy/install.sh --dev + /api/ops/release-readiness READY" \
            --command "MetaEditor compile → verified .ex5" \
            --command "scripts/verify_release.sh (hermetic: locked deps · SBOM · unit+integration · lint+build · manifest · credential scan; HMAC-signed)" \
            --out release-attestation.json
          cosign sign-blob --yes release-attestation.json \
            --output-signature release-attestation.json.sig \
            --output-certificate release-attestation.json.pem \
            --bundle release-attestation.json.bundle   # Rekor bundle → offline verification (audit P2-2)
          cosign verify-blob release-attestation.json \
            --signature release-attestation.json.sig \
            --certificate release-attestation.json.pem \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
              --certificate-github-workflow-repository "${{ github.repository }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          python3 scripts/release_attestation.py verify --file release-attestation.json \
            --sha "${COMMIT_SHA}" --tag "${{ github.ref_name }}" \
            --backend-digest "${BACKEND_DIGEST}" --frontend-digest "${FRONTEND_DIGEST}" --require-images

      - name: Immutable release evidence record (signed)
        env:
          BACKEND_DIGEST: ${{ steps.push.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.push.outputs.frontend_digest }}
        run: |
          python3 - << 'EOF'
          import hashlib, json, os
          def sha256(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for c in iter(lambda: f.read(1 << 20), b""):
                      h.update(c)
              return h.hexdigest()
          checks = {}
          for line in open("SHA256SUMS"):
              digest, name = line.split(maxsplit=1)
              checks[name.strip()] = digest
          manifest = json.load(open("release-manifest.json"))
          evidence = {
              "record": "release-evidence",
              "tag": os.environ["GITHUB_REF_NAME"],
              "commit": os.environ["COMMIT_SHA"],
              "run": {"id": os.environ.get("GITHUB_RUN_ID"),
                      "attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                      "workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF")},
              "artifact_hashes": checks,
              "manifest_sha256": sha256("release-manifest.json"),
              "sha256sums_sha256": sha256("SHA256SUMS"),
              "image_digests": {
                  "backend": os.environ.get("BACKEND_DIGEST"),
                  "frontend": os.environ.get("FRONTEND_DIGEST")},
              "host_agent_source_hash": (manifest.get("host_agent")
                                         or {}).get("source_hash"),
              "ea_version": manifest.get("ea_version"),
              "verifications": [
                  "cosign verify (both image digests)",
                  "cosign verify-blob (manifest + SHA256SUMS)",
                  "BUILD_SHA == GITHUB_SHA commit — annotated tag peeled "
                  "(archive + suite + install gates)",
                  "MetaEditor compile gate (verified .ex5 artifact)"],
          }
          with open("release-evidence.json", "w") as f:
              json.dump(evidence, f, indent=2)
          print(json.dumps(evidence, indent=2))
          EOF
          cosign sign-blob --yes release-evidence.json \
            --output-signature release-evidence.json.sig \
            --output-certificate release-evidence.json.pem
          cosign verify-blob release-evidence.json \
            --signature release-evidence.json.sig \
            --certificate release-evidence.json.pem \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
              --certificate-github-workflow-repository "${{ github.repository }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            stoic-${{ github.ref_name }}.tar.gz
            backend/static/EmergentTradingBridge.ex5
            release-manifest.json
            release-manifest.json.sig
            release-manifest.json.pem
            SHA256SUMS
            SHA256SUMS.sig
            SHA256SUMS.pem
            release-evidence.json
            release-evidence.json.sig
            release-evidence.json.pem
            release-attestation.json
            release-attestation.json.sig
            release-attestation.json.pem
            release-attestation.json.bundle
            evidence/pip-audit.json
            evidence/grype-backend.json
            evidence/junit-unit.xml
            evidence/junit-integration.xml
            evidence/hermetic/hermetic-verification.json
            evidence/hermetic/verification-out/sbom-python-*.txt
            evidence/hermetic/verification-out/sbom-node-*.txt
            sbom-backend.spdx.json
            sbom-frontend.spdx.json
