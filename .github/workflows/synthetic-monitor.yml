name: synthetic-monitor
# External synthetic monitor (audit round 5 P1): probes the public routes from
# GitHub's runners (independent of the platform host) and feeds the edge
# availability SLI. One sample per (region, endpoint, minute) is enforced
# server-side; the region is derived from the prober token.
#
# Secrets: MONITOR_BASE_URL (https://your-domain), EDGE_PROBE_TOKEN_GHA (the
# token configured as `gha:<token>` in EDGE_PROBE_TOKENS on the server).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public routes and report
        env:
          BASE: ${{ secrets.MONITOR_BASE_URL }}
          TOKEN: ${{ secrets.EDGE_PROBE_TOKEN_GHA }}
        run: |
          set -u
          [ -n "${BASE}" ] && [ -n "${TOKEN}" ] || { echo "monitor secrets not configured"; exit 0; }
          fail=0
          for ep in /api/health / /welcome /login /dashboard; do
            start=$(date +%s%3N)
            code=$(curl -sS -o /tmp/body -w '%{http_code}' -m 10 -L "${BASE}${ep}" || echo 000)
            ms=$(( $(date +%s%3N) - start ))
            ok=false; [ "$code" = "200" ] && ok=true
            perr=false; [ "$code" = "000" ] && perr=true
            echo "${ep} → ${code} in ${ms}ms"
            # authenticated routes must not silently fall back to /welcome
            if [ "$ep" = "/dashboard" ] && grep -qi 'data-testid="welcome-page"' /tmp/body; then echo "!! /dashboard rendered the welcome page"; ok=false; fi
            curl -sS -m 10 -X POST "${BASE}/api/public/edge-probe" -H "X-Edge-Probe-Token: ${TOKEN}" -H 'Content-Type: application/json' \
              -d "{\"endpoint\":\"${ep}\",\"ok\":${ok},\"status_code\":${code#0},\"latency_ms\":${ms},\"prober_error\":${perr}}" >/dev/null || true
            [ "$ok" = true ] || fail=1
          done
          # negative auth path must be an explicit 401/403/429 — never a 5xx or a redirect to /welcome
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 10 -X POST "${BASE}/api/auth/login" -H 'Content-Type: application/json' -d '{"email":"monitor@invalid.test","password":"x"}' || echo 000)
          echo "login-failure → ${code}"; case "$code" in 400|401|403|422|429) ;; *) echo "!! unexpected login failure code"; fail=1;; esac
          exit $fail
