# A15-1 — signed inventory policy migration (dual approval via the `policy-approval` GitHub environment:
# configure it with 2 required reviewers in Settings → Environments). The policy is signed with the CI
# release key (purpose policy-migration) and committed to release/policy_migrations/<version>.json; the
# Inventory Go-Live panel (Admin → Brokers) loads it and submits it with the expectation.
name: policy-migration

on:
  workflow_dispatch:
    inputs:
      installation_id:
        description: "STOIC_INSTALLATION_ID of the target host (Admin → System, or backend/.env)"
        required: true
      previous_policy_version:
        description: "policy version currently in force (default install: 6/3/3-v1)"
        required: true
        default: "6/3/3-v1"
      policy_version:
        description: "new policy version, e.g. demo-2x2-v1"
        required: true
      accounts:
        description: "configured accounts"
        required: true
      enabled:
        description: "enabled accounts (= bots)"
        required: true
      account_ids:
        description: "comma-separated platform account ids of the ENABLED accounts"
        required: true
      demo_only:
        description: "DEMO-only policy — every listed account must be an attested DEMO account"
        type: boolean
        default: true
      reason:
        description: "why (>= 10 chars) — recorded in the signed statement"
        required: true
      expires_days:
        description: "validity in days"
        default: "45"

permissions:
  contents: write

concurrency:
  group: policy-migration
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    environment: policy-approval
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6 (pinned)
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (pinned)
        with:
          python-version: "3.11"
      - run: pip install -q cryptography requests
      - name: Sign policy migration with the CI release key
        env:
          APP_ENV: production
          RELEASE_SIGNER: external
          RELEASE_SIGNER_URL: ${{ secrets.RELEASE_SIGNER_URL }}
          RELEASE_SIGNER_TOKEN: ${{ secrets.RELEASE_SIGNER_TOKEN }}
          RELEASE_SIGNER_ALLOWED_HOSTS: ${{ secrets.RELEASE_SIGNER_ALLOWED_HOSTS }}
          RELEASE_SIGNER_KEY_ID: stoic-release-ed25519-v1
          RELEASE_PUBLIC_KEY_B64: ${{ secrets.RELEASE_PUBLIC_KEY_B64 }}
          STOIC_INSTALLATION_ID: ${{ inputs.installation_id }}
        run: |
          set -euo pipefail
          DEMO=""; [ "${{ inputs.demo_only }}" = "true" ] && DEMO="--demo-only"
          python scripts/sign_policy_migration.py \
            --installation-id "${{ inputs.installation_id }}" --environment production \
            --previous "${{ inputs.previous_policy_version }}" --version "${{ inputs.policy_version }}" \
            --accounts "${{ inputs.accounts }}" --enabled "${{ inputs.enabled }}" --bots "${{ inputs.enabled }}" \
            --account-ids "${{ inputs.account_ids }}" $DEMO \
            --reason "${{ inputs.reason }}" --issuer "${{ github.actor }} via policy-approval" \
            --expires-days "${{ inputs.expires_days }}"
      - name: Commit the signed policy
        run: |
          set -euo pipefail
          git config user.name "stoic-policy-bot"
          git config user.email "policy-bot@users.noreply.github.com"
          git add release/policy_migrations/
          git commit -m "policy-migration: ${{ inputs.policy_version }} (demo_only=${{ inputs.demo_only }}) [skip ci]"
          git push origin HEAD:main
