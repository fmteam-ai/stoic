name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Unit + source-level execution-truth tests (no live server needed)
        run: |
          cd backend
          python -m pytest tests/unit \
            tests/test_iter148_p0_exec_truth.py \
            tests/test_iter149_netting_truth.py \
            tests/test_iter150_netting_hedging.py::TestEaSourceScenarios \
            -q

  ea-structural-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: EA structural + version-consistency check
        run: python scripts/check_ea_structure.py
      # NOTE: a genuine MetaEditor compile requires a Windows runner with an
      # MT5 terminal installed. Wire this job to a self-hosted Windows runner:
      #   metaeditor64.exe /compile:backend/static/EmergentTradingBridge.mq5 /log
      # and fail on a non-zero result / "0 errors" absence in the log.

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: cd frontend && yarn install --frozen-lockfile
      - run: cd frontend && yarn build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependency audit (non-blocking report)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ruff (fatal error classes only)
        run: |
          pip install ruff
          ruff check backend --select E9,F63,F7,F82

  container-build:
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t stoic-backend:${{ github.sha }} .
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t stoic-frontend:${{ github.sha }} .
      - name: SBOM (backend image)
        uses: anchore/sbom-action@v0
        with:
          image: stoic-backend:${{ github.sha }}
          format: spdx-json
          output-file: sbom-backend.spdx.json
      - name: Image vulnerability scan
        uses: anchore/scan-action@v4
        with:
          image: stoic-backend:${{ github.sha }}
          fail-build: false
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-backend.spdx.json
      # Artifact signing: push images to your registry and sign with cosign:
      #   cosign sign --key env://COSIGN_KEY $REGISTRY/stoic-backend@$DIGEST
      # (requires registry credentials + COSIGN_KEY secrets configured)
