name: CI

# Least-privilege default — jobs only read the repo; no job needs write.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  # Reused as a required gate by release.yml — a tag can only ship if the
  # exact commit passes every CI job (tests, security scans, builds).
  workflow_call:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Materialise env templates from deploy/env
        run: python3 scripts/sync_env_examples.py
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          # requirements.txt is a pip freeze of the runtime env. The
          # emergentintegrations internal wheel hard-pins openai==1.99.9
          # (app uses a newer one), so it is installed WITHOUT deps from
          # the Emergent index; torch +cpu resolves from the PyTorch index.
          grep -v '^emergentintegrations' backend/requirements.txt > /tmp/ci-reqs.txt
          pip install -r /tmp/ci-reqs.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
          # Emergent CDN index occasionally serves an empty page — retry.
          # SECURITY: --index-url (EXCLUSIVE, no public PyPI fallback —
          # dependency-confusion hardening) + sha256 pin of the exact wheel.
          EI_SHA256=1822c409e24817689541891784b8ec3ff4dfed845ce8cd09fd4feb91ba3a4bdd
          for i in 1 2 3 4 5; do
            pip download --no-deps emergentintegrations==0.2.0 -d /tmp/ei \
              --index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ \
              && break
            echo "emergentintegrations download attempt $i failed — retry in 15s"
            sleep 15
          done
          echo "${EI_SHA256}  /tmp/ei/emergentintegrations-0.2.0-py3-none-any.whl" | sha256sum -c -
          pip install --no-deps /tmp/ei/emergentintegrations-0.2.0-py3-none-any.whl
          pip show -q emergentintegrations
      - name: Credential scan — whole repository incl. top-level tests + recent history (round 10 P0-02)
        run: python3 scripts/secret_scan.py --history
      - name: Collection gate — zero collection failures in the exact
          pinned dependency environment
        run: |
          cd backend
          python -m pytest tests/unit --collect-only -q
      - name: Physically isolated unit suite (tests/unit only — no DB,
          no env, no live server, no marker tree-scan)
        run: |
          cd backend
          python -m pytest tests/unit -q
      - name: Source-level execution-truth tests (no live server needed)
        run: |
          cd backend
          python -m pytest tests/unit \
            tests/test_iter148_p0_exec_truth.py \
            tests/test_iter149_netting_truth.py \
            tests/test_iter150_netting_hedging.py::TestEaSourceScenarios \
            -q

  backend-integration:
    # DB-layer integration tests (order-state machine, risk reservations,
    # trace persistence) against a real MongoDB service container.
    runs-on: ubuntu-latest
    env:
      # r18 P2-03 — integration runs on a REAL single-node replica set so the
      # transactional fenced-effect path (nl_execution.fenced) is exercised, not the CAS fallback
      MONGO_URL: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
      DB_NAME: stoic_ci
    steps:
      - name: Start MongoDB replica set (rs0)
        run: |
          docker run -d --name mongo-rs -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1 && break; sleep 1
          done
          docker exec mongo-rs mongosh --quiet --eval 'rs.initiate({_id:"rs0", members:[{_id:0, host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            [ "$(docker exec mongo-rs mongosh --quiet --eval 'rs.isMaster().ismaster')" = "true" ] && break; sleep 1
          done
          docker exec mongo-rs mongosh --quiet --eval 'rs.isMaster().setName'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Materialise env templates from deploy/env
        run: python3 scripts/sync_env_examples.py
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          # requirements.txt is a pip freeze of the runtime env. The
          # emergentintegrations internal wheel hard-pins openai==1.99.9
          # (app uses a newer one), so it is installed WITHOUT deps from
          # the Emergent index; torch +cpu resolves from the PyTorch index.
          grep -v '^emergentintegrations' backend/requirements.txt > /tmp/ci-reqs.txt
          pip install -r /tmp/ci-reqs.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
          # Emergent CDN index occasionally serves an empty page — retry.
          # SECURITY: --index-url (EXCLUSIVE, no public PyPI fallback —
          # dependency-confusion hardening) + sha256 pin of the exact wheel.
          EI_SHA256=1822c409e24817689541891784b8ec3ff4dfed845ce8cd09fd4feb91ba3a4bdd
          for i in 1 2 3 4 5; do
            pip download --no-deps emergentintegrations==0.2.0 -d /tmp/ei \
              --index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ \
              && break
            echo "emergentintegrations download attempt $i failed — retry in 15s"
            sleep 15
          done
          echo "${EI_SHA256}  /tmp/ei/emergentintegrations-0.2.0-py3-none-any.whl" | sha256sum -c -
          pip install --no-deps /tmp/ei/emergentintegrations-0.2.0-py3-none-any.whl
          pip show -q emergentintegrations
      - name: Integration-classified tests (real MongoDB)
        run: |
          cd backend
          python -m pytest tests/integration -m integration -q
      - name: Critical controls lane (audit r14 P1-05) — REQUIRED; zero
          collection / unexpected skips refused
        run: |
          cd backend
          N=$(python -m pytest tests/integration -m critical_controls --collect-only -q 2>/dev/null | grep -c '::')
          echo "critical_controls collected=$N"
          test "$N" -ge 20 || { echo "critical_controls lane collected $N tests (<20) — lane broken"; exit 1; }
          python -m pytest tests/integration -m critical_controls -q -rs --junitxml=/tmp/junit-critical.xml \
            | tee /tmp/critical.log
          # every SELECTED critical test must pass (module-level skips of unrelated
          # live-only suites are collection noise and do not count)
          P=$(grep -oE '[0-9]+ passed' /tmp/critical.log | grep -oE '[0-9]+' | tail -1)
          test "${P:-0}" -eq "$N" || { echo "critical_controls: passed=$P collected=$N — skips/failures refused"; exit 1; }

  clean-deploy-cert:
    # iter-213 P1 — clean-machine deployment certification: from a FRESH
    # runner install ONLY committed requirements, boot the backend with a
    # minimal generated env against a clean Mongo, and prove liveness +
    # readiness. Certifies that the committed code deploys on a machine
    # with no local state.
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      # r26 P2-02 — the close protocol fails CLOSED without transactions whenever capital is
      # representable (the HTTP matrix creates terminal-bound accounts), so the clean machine
      # runs the SAME single-node replica set production requires
      MONGO_URL: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
      DB_NAME: stoic_cleandeploy
      REDIS_URL: redis://localhost:6379
      BACKGROUND_WORKERS_IN_PROCESS: "false"
    steps:
      - name: Start MongoDB replica set (rs0)
        run: |
          docker run -d --name mongo-rs -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1 && break; sleep 1
          done
          docker exec mongo-rs mongosh --quiet --eval 'rs.initiate({_id:"rs0", members:[{_id:0, host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            [ "$(docker exec mongo-rs mongosh --quiet --eval 'rs.isMaster().ismaster')" = "true" ] && break; sleep 1
          done
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Materialise env templates from deploy/env
        run: python3 scripts/sync_env_examples.py
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          grep -v '^emergentintegrations' backend/requirements.txt > /tmp/ci-reqs.txt
          pip install -r /tmp/ci-reqs.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
          # Emergent CDN index occasionally serves an empty page — retry.
          # SECURITY: --index-url (EXCLUSIVE, no public PyPI fallback —
          # dependency-confusion hardening) + sha256 pin of the exact wheel.
          EI_SHA256=1822c409e24817689541891784b8ec3ff4dfed845ce8cd09fd4feb91ba3a4bdd
          for i in 1 2 3 4 5; do
            pip download --no-deps emergentintegrations==0.2.0 -d /tmp/ei \
              --index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ \
              && break
            echo "emergentintegrations download attempt $i failed — retry in 15s"
            sleep 15
          done
          echo "${EI_SHA256}  /tmp/ei/emergentintegrations-0.2.0-py3-none-any.whl" | sha256sum -c -
          pip install --no-deps /tmp/ei/emergentintegrations-0.2.0-py3-none-any.whl
          pip show -q emergentintegrations
      - name: Boot backend on a clean machine
        run: |
          cd backend
          export JWT_SECRET=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
          export KEY_VAULT_MASTER=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
          export ADMIN_PASSWORD="Ci9!$(python -c "import secrets; print(secrets.token_urlsafe(24))")"
          echo "TEST_ADMIN_PASSWORD=${ADMIN_PASSWORD}" >> "$GITHUB_ENV"
          echo "TEST_ADMIN_EMAIL=${ADMIN_EMAIL:-admin@stoicaibot.com}" >> "$GITHUB_ENV"
          # Test-suite bypasses (server-side secrets, refused when
          # APP_ENV=production): step-up MFA + volume rate limits. The
          # pytest conftest auto-injects them as headers when set, so the
          # HTTP invariant suites can walk certification/activation flows.
          STEP_UP_BYPASS_TOKEN=$(python -c "import secrets; print(secrets.token_urlsafe(24))")
          RATE_LIMIT_BYPASS_TOKEN=$(python -c "import secrets; print(secrets.token_urlsafe(24))")
          echo "::add-mask::${STEP_UP_BYPASS_TOKEN}"
          echo "::add-mask::${RATE_LIMIT_BYPASS_TOKEN}"
          export STEP_UP_BYPASS_TOKEN RATE_LIMIT_BYPASS_TOKEN
          echo "STEP_UP_BYPASS_TOKEN=${STEP_UP_BYPASS_TOKEN}" >> "$GITHUB_ENV"
          echo "RATE_LIMIT_BYPASS_TOKEN=${RATE_LIMIT_BYPASS_TOKEN}" >> "$GITHUB_ENV"
          # order kill-switch stays ON but with test-suite headroom — the
          # invariant matrix legitimately places many orders per minute
          export MAX_ORDERS_PER_MIN=100
          nohup python -m uvicorn server:app --host 127.0.0.1 --port 8001 > /tmp/clean-deploy.log 2>&1 &
      - name: Certify liveness + readiness
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8001/api/health > /dev/null && ok=1 && break
            sleep 2
          done
          [ "${ok:-}" = "1" ] || { echo "backend never became healthy on a clean machine"; tail -80 /tmp/clean-deploy.log; exit 1; }
          curl -sf http://127.0.0.1:8001/api/health/live
          curl -sf http://127.0.0.1:8001/api/health/ready
          echo "clean-machine deployment certified"
      - name: Full PAMM / Risk Truth HTTP invariant matrix (Mongo + Redis +
          live backend — strategy governance, certification campaign,
          strategy guard, safety closure, risk truth, fail-safe asymmetry)
        run: |
          cd backend
          export REACT_APP_BACKEND_URL=http://127.0.0.1:8001
          python -m pytest \
            tests/test_iter216_pamm_strategy_http.py \
            tests/test_iter217_cert_campaign_http.py \
            tests/test_iter218_strategy_guard_http.py \
            tests/test_iter220_safety_closure_http.py \
            tests/test_iter221_risk_truth_http.py \
            tests/test_iter222_hardening_http.py -q
      - name: Backend log on failure
        if: failure()
        run: tail -120 /tmp/clean-deploy.log || true

  ea-structural-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Materialise env templates from deploy/env
        run: python scripts/sync_env_examples.py
      - name: EA structural + version-consistency check
        run: python scripts/check_ea_structure.py
      - name: EA release-hash drift guard (MQ5 vs docs/RELEASE_HASHES.json)
        run: python scripts/check_release_hash_drift.py
      - name: Update-path smoke — every compose secret is provisioned by deploy/lib.sh (N-R2)
        run: python scripts/check_compose_secrets.py

  ea-compile:
    # Real MetaEditor compile gate — fails the pipeline on any MQL error and
    # publishes the exact verified .ex5 artifact.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Install MetaTrader 5 (silent)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile mt5setup.exe
          Start-Process -FilePath .\mt5setup.exe -ArgumentList "/auto" -Wait
          if (-not (Test-Path "C:\Program Files\MetaTrader 5\metaeditor64.exe")) {
            throw "MetaEditor not found after install"
          }
      - name: Compile EA with MetaEditor
        shell: pwsh
        run: |
          $me = "C:\Program Files\MetaTrader 5\metaeditor64.exe"
          $src = (Resolve-Path "backend\static\EmergentTradingBridge.mq5").Path
          Start-Process -FilePath $me -ArgumentList "/compile:`"$src`"","/log:compile.log" -Wait
          $log = Get-Content compile.log -Encoding Unicode -Raw
          Write-Host $log
          if ($log -notmatch "0 error") { throw "EA compilation reported errors" }
          if (-not (Test-Path "backend\static\EmergentTradingBridge.ex5")) {
            throw "Compiled .ex5 not produced"
          }
      - name: Publish verified .ex5 artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: EmergentTradingBridge-ex5
          path: backend/static/EmergentTradingBridge.ex5

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: cd frontend && yarn install --frozen-lockfile
      - run: cd frontend && yarn build

  frontend-quality:
    # Frontend quality gates — lint (eslint flat config), typecheck
    # (tsc --noEmit) and unit tests (vitest). E2E runs in frontend-e2e.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: cd frontend && yarn install --frozen-lockfile
      - name: Lint
        run: cd frontend && yarn lint
      - name: Typecheck
        run: cd frontend && yarn typecheck
      - name: Unit tests
        run: cd frontend && yarn test

  frontend-e2e:
    # Real-browser UI qualification — Playwright drives the production build
    # of the frontend against a live backend + MongoDB. A release cannot ship
    # if login, dashboard, settings or core pages break in an actual browser.
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: stoic_e2e
      CORS_ORIGINS: http://127.0.0.1:3000
      BACKGROUND_WORKERS_IN_PROCESS: "false"
      # main92 — admin MFA stays ENFORCED here: the per-run CI admin gets a generated
      # TOTP secret (scripts/ci_enrol_admin_totp.py) and Playwright computes the code.
      ADMIN_MFA_ENFORCED: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install backend dependencies
        run: |
          # requirements.txt is a pip freeze of the runtime env. The
          # emergentintegrations internal wheel hard-pins openai==1.99.9
          # (app uses a newer one), so it is installed WITHOUT deps from
          # the Emergent index; torch +cpu resolves from the PyTorch index.
          grep -v '^emergentintegrations' backend/requirements.txt > /tmp/ci-reqs.txt
          pip install -r /tmp/ci-reqs.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
          # Emergent CDN index occasionally serves an empty page — retry.
          # SECURITY: --index-url (EXCLUSIVE, no public PyPI fallback —
          # dependency-confusion hardening) + sha256 pin of the exact wheel.
          EI_SHA256=1822c409e24817689541891784b8ec3ff4dfed845ce8cd09fd4feb91ba3a4bdd
          for i in 1 2 3 4 5; do
            pip download --no-deps emergentintegrations==0.2.0 -d /tmp/ei \
              --index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ \
              && break
            echo "emergentintegrations download attempt $i failed — retry in 15s"
            sleep 15
          done
          echo "${EI_SHA256}  /tmp/ei/emergentintegrations-0.2.0-py3-none-any.whl" | sha256sum -c -
          pip install --no-deps /tmp/ei/emergentintegrations-0.2.0-py3-none-any.whl
          pip show -q emergentintegrations
      - name: Generate random CI admin credentials
        run: |
          echo "ADMIN_PASSWORD=Ci9!$(python -c "import secrets; print(secrets.token_urlsafe(24))")" >> "$GITHUB_ENV"
          echo "ADMIN_EMAIL=admin@stoicaibot.com" >> "$GITHUB_ENV"
      - name: Start backend
        run: |
          cd backend
          export JWT_SECRET=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
          export KEY_VAULT_MASTER=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
          export METRICS_TOKEN=$(python -c "import secrets; print(secrets.token_urlsafe(24))")
          nohup python -m uvicorn server:app --host 127.0.0.1 --port 8001 > /tmp/backend.log 2>&1 &
      - name: Build and serve frontend (production build)
        run: |
          cd frontend
          yarn install --frozen-lockfile
          REACT_APP_BACKEND_URL=http://127.0.0.1:8001 yarn build
          nohup npx serve -s build -l 3000 > /tmp/serve.log 2>&1 &
      - name: Wait for backend + frontend
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8001/api/health > /dev/null && backend_ok=1 && break
            sleep 2
          done
          [ "${backend_ok:-}" = "1" ] || { echo "backend never became healthy"; tail -50 /tmp/backend.log; exit 1; }
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000 > /dev/null && exit 0
            sleep 2
          done
          echo "frontend never became reachable"; tail -20 /tmp/serve.log; exit 1
      - name: Enrol TOTP on the CI admin (admin MFA enforced in the UI tests)
        run: |
          SECRET=$(python scripts/ci_enrol_admin_totp.py)
          echo "::add-mask::$SECRET"
          echo "E2E_ADMIN_TOTP_SECRET=$SECRET" >> "$GITHUB_ENV"
      - name: Install Playwright
        run: |
          cd e2e
          yarn install --frozen-lockfile
          npx playwright install --with-deps chromium
      - name: Run Playwright UI tests
        run: |
          cd e2e
          E2E_ADMIN_EMAIL="$ADMIN_EMAIL" E2E_ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            E2E_ADMIN_TOTP_SECRET="$E2E_ADMIN_TOTP_SECRET" \
            E2E_BASE_URL=http://127.0.0.1:3000 npx playwright test
      - name: Backend log on failure
        if: failure()
        run: tail -100 /tmp/backend.log || true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: playwright-report
          path: e2e/playwright-report/


  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          # Full history — a shallow clone makes gitleaks see the entire tree
          # as one new commit, breaking .gitleaksignore commit-pinned
          # fingerprints.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Dependency audit (BLOCKING — pinned deps, documented ignores)
        run: |
          pip install pip-audit
          # Audit the pinned public deps only (internal wheels + local-tag
          # torch build are excluded from OSV resolution).
          grep -vE '^--|^#|\+cpu|^emergentintegrations' backend/requirements.txt > /tmp/audit-reqs.txt
          # Zero accepted risks: python-jose/ecdsa removed (unused) iter-156.
          pip-audit -r /tmp/audit-reqs.txt --no-deps --strict
      - name: Secret scan (BLOCKING — pinned gitleaks, honors .gitleaksignore)
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --no-banner --exit-code 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: "20"
      - name: Frontend dependency audit (BLOCKING on high/critical, prod deps)
        run: |
          cd frontend
          npx audit-ci@^7 --config audit-ci.jsonc

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Ruff (fatal error classes only)
        run: |
          pip install ruff
          ruff check backend --select E9,F63,F7,F82
      - name: Test manifest drift check
        run: python scripts/generate_test_manifest.py --check

  container-build:
    runs-on: ubuntu-latest
    needs: [backend-unit, backend-integration, frontend-build]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Build backend image
        run: docker build -f Dockerfile.backend --build-arg GIT_SHA=${{ github.sha }} -t stoic-backend:${{ github.sha }} .
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t stoic-frontend:${{ github.sha }} .
      - name: SBOM (backend image)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          image: stoic-backend:${{ github.sha }}
          format: spdx-json
          output-file: sbom-backend.spdx.json
      - name: SBOM (frontend image)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          image: stoic-frontend:${{ github.sha }}
          format: spdx-json
          output-file: sbom-frontend.spdx.json
      # Image vulnerability gate — grype runs DIRECTLY (pinned binary from the
      # scan-action installer, DB restored from the Actions cache) against the
      # syft SBOMs produced above, so the gate never depends on docker-daemon
      # image access and every grype error line is visible in the job log.
      # Exit 2 = fixable critical found (BLOCKING); any other non-zero exit is
      # a scanner fault and is retried once before failing.
      - name: Install grype (pinned, DB cached)
        id: grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7
        with:
          cache-db: true
      - name: Image vulnerability scan (BLOCKING on fixable criticals)
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          set -o pipefail
          scan() {  # $1 = sbom file, $2 = label
            for attempt in 1 2; do
              rc=0
              "$GRYPE" "sbom:$1" --fail-on critical --only-fixed -o table --file "grype-$2.txt" \
                && "$GRYPE" "sbom:$1" -o sarif --file "grype-$2.sarif" >/dev/null || rc=$?
              cat "grype-$2.txt" 2>/dev/null || true
              if [ "$rc" = 0 ]; then echo "== $2: no fixable critical vulnerabilities"; return 0; fi
              if [ "$rc" = 2 ]; then echo "::error::$2 image has FIXABLE CRITICAL vulnerabilities (see table above)"; return 2; fi
              echo "::warning::grype scanner fault on $2 (exit $rc) — attempt $attempt"
              sleep 10
            done
            echo "::error::grype could not scan $2 after 2 attempts (exit $rc)"; return "$rc"
          }
          scan sbom-backend.spdx.json backend
          scan sbom-frontend.spdx.json frontend
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        if: always()
        with:
          name: grype-scan-results
          path: |
            grype-*.txt
            grype-*.sarif
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: sbom
          path: |
            sbom-backend.spdx.json
            sbom-frontend.spdx.json
      # Tagged releases are signed via .github/workflows/release.yml
      # (cosign keyless sign-blob of the manifest + SHA256SUMS).
