name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused as a required gate by release.yml — a tag can only ship if the
  # exact commit passes every CI job (tests, security scans, builds).
  workflow_call:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install -r backend/requirements.txt
          pip install emergentintegrations==0.2.0 --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
      - name: Unit + source-level execution-truth tests (no live server needed)
        run: |
          cd backend
          python -m pytest tests/unit \
            tests/test_iter148_p0_exec_truth.py \
            tests/test_iter149_netting_truth.py \
            tests/test_iter150_netting_hedging.py::TestEaSourceScenarios \
            -q

  backend-integration:
    # DB-layer integration tests (order-state machine, risk reservations,
    # trace persistence) against a real MongoDB service container.
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: stoic_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install -r backend/requirements.txt
          pip install emergentintegrations==0.2.0 --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
      - name: Integration-classified tests (real MongoDB)
        run: |
          cd backend
          python -m pytest -m integration -q

  ea-structural-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: EA structural + version-consistency check
        run: python scripts/check_ea_structure.py

  ea-compile:
    # Real MetaEditor compile gate — fails the pipeline on any MQL error and
    # publishes the exact verified .ex5 artifact.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MetaTrader 5 (silent)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile mt5setup.exe
          Start-Process -FilePath .\mt5setup.exe -ArgumentList "/auto" -Wait
          if (-not (Test-Path "C:\Program Files\MetaTrader 5\metaeditor64.exe")) {
            throw "MetaEditor not found after install"
          }
      - name: Compile EA with MetaEditor
        shell: pwsh
        run: |
          $me = "C:\Program Files\MetaTrader 5\metaeditor64.exe"
          $src = (Resolve-Path "backend\static\EmergentTradingBridge.mq5").Path
          Start-Process -FilePath $me -ArgumentList "/compile:`"$src`"","/log:compile.log" -Wait
          $log = Get-Content compile.log -Encoding Unicode -Raw
          Write-Host $log
          if ($log -notmatch "0 error") { throw "EA compilation reported errors" }
          if (-not (Test-Path "backend\static\EmergentTradingBridge.ex5")) {
            throw "Compiled .ex5 not produced"
          }
      - name: Publish verified .ex5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmergentTradingBridge-ex5
          path: backend/static/EmergentTradingBridge.ex5

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: cd frontend && yarn install --frozen-lockfile
      - run: cd frontend && yarn build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — a shallow clone makes gitleaks see the entire tree
          # as one new commit, breaking .gitleaksignore commit-pinned
          # fingerprints.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependency audit (BLOCKING — pinned deps, documented ignores)
        run: |
          pip install pip-audit
          # Audit the pinned public deps only (internal wheels + local-tag
          # torch build are excluded from OSV resolution).
          grep -vE '^--|^#|\+cpu' backend/requirements.txt > /tmp/audit-reqs.txt
          # Accepted (tracked in memory/PRD.md):
          #   PYSEC-2026-1325   ecdsa — no fixed release exists upstream
          #   starlette PYSECs  — fix requires fastapi>=0.115 major upgrade (backlog P1)
          pip-audit -r /tmp/audit-reqs.txt --no-deps --strict \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1943 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281
      - name: Secret scan (BLOCKING — pinned gitleaks, honors .gitleaksignore)
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --no-banner --exit-code 1

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ruff (fatal error classes only)
        run: |
          pip install ruff
          ruff check backend --select E9,F63,F7,F82

  container-build:
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t stoic-backend:${{ github.sha }} .
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t stoic-frontend:${{ github.sha }} .
      - name: SBOM (backend image)
        uses: anchore/sbom-action@v0
        with:
          image: stoic-backend:${{ github.sha }}
          format: spdx-json
          output-file: sbom-backend.spdx.json
      - name: SBOM (frontend image)
        uses: anchore/sbom-action@v0
        with:
          image: stoic-frontend:${{ github.sha }}
          format: spdx-json
          output-file: sbom-frontend.spdx.json
      - name: Image vulnerability scan — backend (BLOCKING on critical findings)
        uses: anchore/scan-action@v4
        with:
          image: stoic-backend:${{ github.sha }}
          fail-build: true
          severity-cutoff: critical
      - name: Image vulnerability scan — frontend (BLOCKING on critical findings)
        uses: anchore/scan-action@v4
        with:
          image: stoic-frontend:${{ github.sha }}
          fail-build: true
          severity-cutoff: critical
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-backend.spdx.json
            sbom-frontend.spdx.json
      # Tagged releases are signed via .github/workflows/release.yml
      # (cosign keyless sign-blob of the manifest + SHA256SUMS).
