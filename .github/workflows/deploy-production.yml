# Zero-touch re-publish to YOUR server (opt-in).
#
# Trigger: push a release tag (v1.2.3) — or run manually from the Actions
# tab. Either way the ref is resolved IN CI to a 40-hex commit SHA that MUST
# be pointed at by a v* release tag (branches are refused), and only that
# SHA is transmitted to the server. deploy/update.sh then backs up, rebuilds
# with provenance, verifies the full topology and auto-rolls back on failure.
# Protect the `production` GitHub Environment with a required reviewer for a
# manual approval step; use a least-privilege deploy user (docker group only).
#
# Required repository secrets (Settings → Secrets → Actions):
#   DEPLOY_HOST         server IP or hostname
#   DEPLOY_USER         SSH user that owns the stoic checkout (in docker group)
#   DEPLOY_SSH_KEY      private key (ed25519) whose public key is in
#                       ~DEPLOY_USER/.ssh/authorized_keys on the server
#   DEPLOY_PATH         absolute path of the checkout, e.g. /opt/stoic
#   DEPLOY_KNOWN_HOSTS  the server's pinned SSH host key line(s), captured OUT OF
#                       BAND and verified against the server console, e.g.
#                       `ssh-keyscan -p 22 -t ed25519 <host>` run from a trusted
#                       network, then compare the fingerprint with
#                       `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub` on the
#                       server. TOFU keyscan in CI is NOT used (MITM-able); the
#                       workflow FAILS when this secret is missing.
# Optional:
#   DEPLOY_PORT         SSH port (default 22)
name: deploy-production

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "release tag (vX.Y.Z) or the SHA of a tagged release"
        required: true

# least privilege: the job only reads the repository (deploy goes over SSH)
permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      - name: Checkout (full history for tag reachability)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6 (pinned, audit P2-1)
        with:
          fetch-depth: 0

      - name: Resolve ref → immutable SHA reachable from a signed release tag
        id: ref
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then REQ="${GITHUB_REF_NAME}"; else REQ="${{ inputs.ref }}"; fi
          # only tags, branches or hex SHAs — no shell metacharacters ever reach the server
          echo "${REQ}" | grep -qE '^[A-Za-z0-9._/-]{1,128}$' || { echo "::error::invalid ref '${REQ}'"; exit 1; }
          SHA=$(git rev-parse --verify "${REQ}^{commit}")
          echo "${SHA}" | grep -qE '^[0-9a-f]{40}$' || { echo "::error::could not resolve '${REQ}' to a commit"; exit 1; }
          # release-path guard: the commit must be pointed at by a v* tag
          TAG=$(git tag --points-at "${SHA}" | grep -E '^v[0-9]' | head -1 || true)
          [ -n "${TAG}" ] || { echo "::error::${SHA} is not a tagged release (v*). Tag it first — branches are not deployable."; exit 1; }
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "deploying ${TAG} @ ${SHA}"

      - name: Prepare SSH (pinned host key — no keyscan)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "${DEPLOY_KNOWN_HOSTS}" ] || { echo "::error::DEPLOY_KNOWN_HOSTS secret is required (pinned server host key — see header)"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Publish on server (deploy/update.sh)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "cd '${DEPLOY_PATH}' && git fetch --all --tags --prune && deploy/update.sh ${SHA}"

      - name: Report
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "cd '${DEPLOY_PATH}' && tail -3 deploy/releases.log && docker compose ps --format '{{.Name}}\t{{.Status}}'" || true
