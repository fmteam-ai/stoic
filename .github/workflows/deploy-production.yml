# Zero-touch re-publish to YOUR server (opt-in).
#
# Trigger: the Release workflow (release.yml) COMPLETING SUCCESSFULLY for a v* tag — never in
# parallel with it (N101-7: a server must only ever receive a tag whose release assets exist) —
# or run manually from the Actions tab. Either way the ref is resolved IN CI to a 40-hex commit
# SHA that MUST be pointed at by a v* release tag (branches are refused), and only that
# SHA is transmitted to the server. deploy/update.sh then backs up, adopts the signed release
# lock, rebuilds with provenance, verifies the full topology and auto-rolls back on failure.
# Protect the `production` GitHub Environment with a required reviewer for a
# manual approval step; use a least-privilege deploy user (docker group only).
#
# Required repository secrets (Settings → Secrets → Actions):
#   DEPLOY_HOST         server IP or hostname
#   DEPLOY_USER         SSH user that owns the stoic checkout (in docker group)
#   DEPLOY_SSH_KEY      private key (ed25519) whose public key is in
#                       ~DEPLOY_USER/.ssh/authorized_keys on the server
#   DEPLOY_PATH         absolute path of the checkout, e.g. /opt/stoic
# Optional:
#   DEPLOY_PORT         SSH port (default 22)
name: deploy-production

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "release tag (vX.Y.Z) or the SHA of a tagged release"
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  publish:
    # workflow_run: only after a SUCCESSFUL Release run that was triggered by a tag
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      - name: Checkout (full history for tag reachability)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6 (pinned, audit P2-1)
        with:
          fetch-depth: 0

      - name: Resolve ref → immutable SHA reachable from a signed release tag
        id: ref
        # SEC-001 (audit #15): untrusted context (branch / dispatch input) is bound to env, never expanded
        # inline in the shell — a crafted ref name must not run in the job that holds the production SSH key
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_run" ]; then REQ="${HEAD_BRANCH}"; else REQ="${INPUT_REF}"; fi
          # only tags, branches or hex SHAs — no shell metacharacters ever reach the server
          echo "${REQ}" | grep -qE '^[A-Za-z0-9._/-]{1,128}$' || { echo "::error::invalid ref '${REQ}'"; exit 1; }
          SHA=$(git rev-parse --verify "${REQ}^{commit}")
          echo "${SHA}" | grep -qE '^[0-9a-f]{40}$' || { echo "::error::could not resolve '${REQ}' to a commit"; exit 1; }
          # release-path guard: the commit must be pointed at by a v* tag
          TAG=$(git tag --points-at "${SHA}" | grep -E '^v[0-9]' | head -1 || true)
          [ -n "${TAG}" ] || { echo "::error::${SHA} is not a tagged release (v*). Tag it first — branches are not deployable."; exit 1; }
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "deploying ${TAG} @ ${SHA}"

      - name: Zero-touch publish configured? (opt-in — skip cleanly when the DEPLOY_* secrets are absent)
        id: cfg
        env:
          HAS_HOST: ${{ secrets.DEPLOY_HOST != '' }}
          HAS_USER: ${{ secrets.DEPLOY_USER != '' }}
          HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_PATH: ${{ secrets.DEPLOY_PATH != '' }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          if [ "${HAS_HOST}${HAS_USER}${HAS_KEY}${HAS_PATH}" = "truetruetruetrue" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::zero-touch publish not configured (DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY/DEPLOY_PATH secrets missing) — publish manually: deploy/update.sh ${TAG}"
          fi

      - name: Prepare SSH
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || 22 }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Publish on server (deploy/update.sh)
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT || 22 }}" \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "cd '${{ secrets.DEPLOY_PATH }}' && git fetch --all --tags --prune && deploy/update.sh ${{ steps.ref.outputs.sha }}"

      - name: Report
        if: always() && steps.cfg.outputs.enabled == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT || 22 }}" \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "cd '${{ secrets.DEPLOY_PATH }}' && tail -3 deploy/releases.log && docker compose ps --format '{{.Name}}\t{{.Status}}'" || true
