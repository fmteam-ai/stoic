# Weekly vulnerability sweep — catches CVEs disclosed AFTER the last push
# (the push/PR-triggered CI security-scan only runs when code changes).
name: Scheduled dependency audit

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  backend-pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: pip-audit (BLOCKING)
        run: |
          pip install pip-audit
          grep -vE '^--|^#|\+cpu' backend/requirements.txt > /tmp/audit-reqs.txt
          pip-audit -r /tmp/audit-reqs.txt --no-deps --strict

  frontend-yarn-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: "20"
      - name: audit-ci (BLOCKING on high/critical, production deps)
        run: |
          cd frontend
          npx audit-ci@^7 --config audit-ci.jsonc
